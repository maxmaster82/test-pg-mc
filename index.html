<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ticket Management Admin Portal" />
    <title>Ticket Admin</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      // Keep the key in sync with THEME_STORAGE_KEY (src/app/preferences/store.ts).
      try {
        var t = localStorage.getItem('ticket-admin:theme')
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
